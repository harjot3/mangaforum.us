spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mangaforum}
    username: ${DATABASE_USER:mangaforum}
    password: ${DATABASE_PASSWORD:local-development-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
